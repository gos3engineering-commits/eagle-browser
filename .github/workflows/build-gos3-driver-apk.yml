name: Build GOS3 Driver APK

on:
  push:
    paths:
      - 'android-driver/**'
      - '.github/workflows/build-gos3-driver-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-driver
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/GOS3-Driver.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GOS3-Driver-APK
          path: android-driver/app/build/outputs/apk/debug/GOS3-Driver.apk
          if-no-files-found: error
