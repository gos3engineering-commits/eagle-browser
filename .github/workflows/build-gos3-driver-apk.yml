name: Build GOS3 Driver APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android SDK 35
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Download Gradle
        run: |
          curl -L -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp

      - name: Build APK
        run: /tmp/gradle-8.9/bin/gradle -p android-driver assembleDebug -Pandroid.useAndroidX=true -Pandroid.enableJetifier=true

      - name: Rename APK
        run: cp android-driver/app/build/outputs/apk/debug/app-debug.apk android-driver/app/build/outputs/apk/debug/GOS3-Driver.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GOS3-Driver-APK
          path: android-driver/app/build/outputs/apk/debug/GOS3-Driver.apk
